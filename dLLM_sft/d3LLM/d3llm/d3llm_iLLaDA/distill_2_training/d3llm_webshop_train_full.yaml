# Based on the d3LLM-LLaDA WebShop recipe, extended to six epochs for iLLaDA.
# iLLaDA's loader uses its own tokenizer and normalizes responses to <think>.
model:
    name: "GSAI-ML/iLLaDA-8B-Instruct"
    trust_remote_code: true
    torch_dtype: "bfloat16"

training:
    output_dir: "output_model/iLLaDA_WebShop_SFT_full"
    num_train_epochs: 6
    gradient_accumulation_steps: 2
    per_device_train_batch_size: 2
    logging_steps: 10
    learning_rate: 0.00001
    weight_decay: 0.01
    bf16: true
    optim: "adamw_torch"
    max_grad_norm: 1
    group_by_length: false
    lr_scheduler_type: "cosine"
    save_strategy: "epoch"
    save_total_limit: 2
    report_to: "none"
    logging_first_step: true

lora:
    enabled: false

data:
    train_files: ""
    val_files: ""
    format: auto
    success_only: true

distillation:
    trajectory_dataset_path: null
    max_length: 4096
    use_naive_random_mask: true
    use_complementary_loss: true
    progressive_block_sizes: [32, 32, 32, 32, 32, 32]
    min_mask_ratio: 0.0
    max_mask_ratio: 0.8
    temperature: 0.5
    entropy_weight: 2.0
    num_proc: 8
